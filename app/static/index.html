<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DNA Cloning Assistant</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="title">
    <h1>DNA Cloning Assistant</h1>
    <span id="file-name" class="muted">파일 없음</span>
  </div>
  <div class="toolbar">
    <label class="btn">파일 열기<input type="file" id="file-input" accept=".dna" hidden></label>
    <button id="btn-save" class="btn">저장</button>
    <button id="btn-download" class="btn">내려받기</button>
    <span id="status" class="status"></span>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="map">맵</button>
  <button class="tab" data-tab="sequence">서열</button>
  <button class="tab" data-tab="features">Features</button>
  <button class="tab" data-tab="primers">Primers</button>
  <button class="tab" data-tab="pcr">Pfu-X PCR</button>
</nav>

<main>
  <!-- ------------------------------------------------------------ map -->
  <section id="tab-map" class="panel active">
    <div class="map-wrap">
      <svg id="plasmid-map" viewBox="0 0 520 520" aria-label="plasmid map"></svg>
      <div class="map-side">
        <h2 id="map-title">—</h2>
        <p id="map-meta" class="muted"></p>
        <ul id="map-legend" class="legend"></ul>
      </div>
    </div>
  </section>

  <!-- ------------------------------------------------------- sequence -->
  <section id="tab-sequence" class="panel">
    <div class="row">
      <label>이동 <input type="number" id="goto-pos" min="1" value="1" style="width:7em"></label>
      <button id="btn-goto" class="btn small">가기</button>
      <label><input type="checkbox" id="show-revcomp"> 상보가닥 표시</label>
      <label><input type="checkbox" id="show-translation" checked> 번역 feature 색칠</label>
      <span id="selection-info" class="muted"></span>
    </div>
    <div id="sequence-view" class="seqview"></div>
    <div class="editbox">
      <h3>서열 편집</h3>
      <div class="row">
        <label>시작 <input type="number" id="edit-start" min="1" style="width:7em"></label>
        <label>끝 <input type="number" id="edit-end" min="1" style="width:7em"></label>
        <label class="grow">새 서열 (비우면 삭제)
          <input type="text" id="edit-replacement" placeholder="ACGT…"></label>
        <button id="btn-edit" class="btn primary">적용</button>
      </div>
      <p class="muted">편집 범위에 걸친 feature는 남은 부분으로 잘리고, 완전히 포함된 feature는 삭제됩니다.</p>
    </div>
  </section>

  <!-- ------------------------------------------------------- features -->
  <section id="tab-features" class="panel">
    <table class="grid" id="feature-table">
      <thead><tr><th>이름</th><th>종류</th><th>방향</th><th>시작</th><th>끝</th>
        <th>길이</th><th>색</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <h3>feature 추가</h3>
    <div class="row">
      <input id="nf-name" placeholder="이름">
      <input id="nf-type" placeholder="CDS / promoter / misc_feature" value="misc_feature">
      <select id="nf-dir"><option value="1">→ forward</option><option value="2">← reverse</option>
        <option value="0">방향 없음</option></select>
      <input type="number" id="nf-start" placeholder="시작" style="width:7em">
      <input type="number" id="nf-end" placeholder="끝" style="width:7em">
      <input type="color" id="nf-color" value="#3366ff">
      <button id="btn-add-feature" class="btn primary">추가</button>
    </div>
  </section>

  <!-- -------------------------------------------------------- primers -->
  <section id="tab-primers" class="panel">
    <table class="grid" id="primer-table">
      <thead><tr><th>이름</th><th>서열 (5'→3')</th><th>길이</th><th>GC%</th><th>Tm</th>
        <th>결합 위치</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <h3>프라이머 추가</h3>
    <div class="row">
      <input id="np-name" placeholder="이름">
      <input id="np-seq" class="grow mono" placeholder="5'→3' 서열">
      <button id="btn-add-primer" class="btn primary">추가</button>
    </div>
  </section>

  <!-- ------------------------------------------------------------ pcr -->
  <section id="tab-pcr" class="panel">
    <div class="pcr-inputs">
      <div class="pcr-primer">
        <h3>Forward primer</h3>
        <select id="pcr-fwd-pick"><option value="">저장된 프라이머에서 선택…</option></select>
        <input id="pcr-fwd-name" placeholder="이름">
        <textarea id="pcr-fwd-seq" class="mono" rows="3" placeholder="5'→3' 서열"></textarea>
      </div>
      <div class="pcr-primer">
        <h3>Reverse primer</h3>
        <select id="pcr-rev-pick"><option value="">저장된 프라이머에서 선택…</option></select>
        <input id="pcr-rev-name" placeholder="이름">
        <textarea id="pcr-rev-seq" class="mono" rows="3" placeholder="5'→3' 서열"></textarea>
      </div>
      <div class="pcr-conditions">
        <h3>반응 조건</h3>
        <label>프라이머 농도 (nM)<input type="number" id="c-primer" value="250" step="10"></label>
        <label>Na⁺ (mM)<input type="number" id="c-na" value="10" step="1"></label>
        <label>Mg²⁺ (mM)<input type="number" id="c-mg" value="2" step="0.5"></label>
        <label>dNTP (mM)<input type="number" id="c-dntp" value="0.2" step="0.05"></label>
        <label>Ta = min(Tm) − <input type="number" id="c-offset" value="5" step="1"> °C</label>
        <label>신장 속도 (초/kb)<input type="number" id="c-ext" value="30" step="5"></label>
        <label>사이클 수<input type="number" id="c-cycles" value="30" step="1"></label>
        <label>반응 부피 (µL)<input type="number" id="c-volume" value="50" step="5"></label>
        <label class="check"><input type="checkbox" id="c-ignore-template"> 주형 무시(Tm만 계산)</label>
        <button id="btn-pcr" class="btn primary">PCR 조건 계산</button>
      </div>
    </div>
    <div id="pcr-result"></div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
